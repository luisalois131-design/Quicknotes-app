<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickNotes | Your Personal Note Manager</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>QuickNotes</h1>
        <p>Capture your thoughts. Organize your life.</p>
    </header>

    <main>
        <section id="add-note-section">
            <h2>Add a note</h2>

            <form id="note-form">
                <label for="note-input">Write your note:</label>

                <input
                    type="text"
                    id="note-input"
                    name="note"
                    placeholder="What do you want to remember?"
                    maxlength="200"
                    required
                >

                <label for="note-category">Choose a category:</label>

                <select id="note-category" name="category">
                    <option value="Personal">Personal</option>
                    <option value="Work">Work</option>
                    <option value="Study">Study</option>
                </select>

                <button type="submit">Add Note</button>
            </form>

            <p id="error-message" role="alert"></p>
        </section>

        <section id="your-notes-section">
            <h2>Your notes</h2>

            <label for="search-input">Search your notes:</label>
            <input
                type="search"
                id="search-input"
                placeholder="Search by note text..."
            >

            <p id="note-count">You have no notes yet.</p>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. Keep your thoughts organized.</p>
    </footer>

</body>
</html>
